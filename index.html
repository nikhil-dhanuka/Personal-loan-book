<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Loan Book</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Loan Book">
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#14231c;--mu:#667;--pr:#0f6b4f;--bd:#dde3df;--rd:#c0392b;--or:#c77700;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1512;--card:#17211c;--tx:#e8f0ec;--mu:#9ab;--pr:#3fbf92;--bd:#2a3731}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding-bottom:140px}
main{max-width:760px;margin:auto;padding:12px}h2{margin:8px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.n{font-size:22px;font-weight:700}.l{color:var(--mu);font-size:12px}
input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%;margin:3px 0}
button{background:var(--pr);color:#fff;border:0;font-weight:600;cursor:pointer}button.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.r{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}.r:last-child{border:0}
.b{padding:2px 8px;border-radius:99px;font-size:11px;color:#fff;background:var(--pr)}.b.o{background:var(--rd)}.b.w{background:var(--or)}
a.b{text-decoration:none;padding:6px 10px;margin-left:4px;display:inline-block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;color:var(--mu);border-radius:0;font-size:12px;margin:0}nav button.a{color:var(--pr)}
.fab{position:fixed;right:14px;bottom:calc(66px + env(safe-area-inset-bottom,0px));width:auto;border-radius:99px;padding:12px 18px;box-shadow:0 3px 10px #0004}
.ov{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
@media print{nav,.fab,.np{display:none}}
</style></head><body><main id="app"></main>
<div id="toast" style="display:none;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;background:#14231c;color:#fff;padding:12px;border-radius:10px;z-index:9;text-align:center"></div>
<div id="dlg" style="display:none;position:fixed;inset:0;background:#0007;z-index:10;padding:12px"></div>
<button class="fab np" id="fab" onclick="go('pay')" style="display:none">+ Payment</button><nav id="nav" class="np"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
const SB=supabase.createClient('https://mkxpczxiuxjbdyniycuc.supabase.co','sb_publishable_o9Bi8ErUk_P3YelN6i9rhQ_GzoL4t_d');
const $=i=>document.getElementById(i),inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=iso(new Date()),pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const dueOf=(y,m,d)=>{const x=new Date(y,m,1);return iso(new Date(x.getFullYear(),x.getMonth(),Math.min(d,new Date(x.getFullYear(),x.getMonth()+1,0).getDate())))};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TOM=iso(new Date(pd(TODAY).getTime()+864e5));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>t.style.display='none',3500)}
function ask(m){return new Promise(r=>{const d=$('dlg');d.innerHTML='<div class="c" style="max-width:340px;margin:30vh auto"><p>'+esc(m)+'</p><button id="y">OK</button><button class="s" id="n">Cancel</button></div>';d.style.display='block';$('y').onclick=()=>{d.style.display='none';r(true)};$('n').onclick=()=>{d.style.display='none';r(false)}})}
let S={auth:false,cust:[],loans:[],tx:[],view:'home',sel:null,rec:null,owner:localStorage.getItem('owner')||'Nikhil',pref:null};
const isDeb=t=>['Loan Disbursement','Interest Generated','Penalty'].includes(t.type);
const cn=i=>(S.cust.find(c=>c.id===i)||{}).name||'?';
async function load(){const[c,l,t]=await Promise.all([SB.from('customers').select('*').order('name'),SB.from('loans').select('*').order('created_at'),SB.from('transactions').select('*').order('tx_date').order('created_at').limit(5000)]);const e=c.error||l.error||t.error;if(e)return toast('Load failed: '+e.message);S.cust=c.data;S.loans=l.data.map(x=>({...x,cust:x.customer_id,start:x.start_date,firstDue:x.first_due,dueDay:x.due_day,rate:+x.rate,amount:+x.amount}));S.tx=t.data.map(x=>({...x,loan:x.loan_id,cust:x.customer_id,date:x.tx_date,amount:+x.amount,int:+x.interest_part,prin:+x.principal_part,pen:+(x.penalty_part||0),ref:x.reference,ts:x.created_at}))}
function prinAt(l,d){return S.tx.filter(t=>t.loan===l.id&&t.date<=d).reduce((a,t)=>a+(t.type==='Loan Disbursement'?t.amount:0)-(t.type.includes('Payment')?t.prin:0),0)}
async function gen(){const rows=[];S.loans.filter(l=>l.status==='ACTIVE').forEach(l=>{const s=pd(l.firstDue);for(let k=0;;k++){const due=dueOf(s.getFullYear(),s.getMonth()+k,l.dueDay);if(due>TODAY)break;const key=l.id+'|'+due;if(S.tx.some(t=>t.period_key===key))continue;const p=prinAt(l,due);if(p>0)rows.push({loan_id:l.id,customer_id:l.cust,tx_date:due,type:'Interest Generated',amount:Math.round(p*l.rate/100),period_key:key})}});if(rows.length){const r=await SB.from('transactions').upsert(rows,{onConflict:'period_key',ignoreDuplicates:true});if(r.error)toast('Interest error: '+r.error.message);else await load()}}
function nextDue(l){if(l.firstDue>TODAY)return l.firstDue;const t=pd(TODAY);for(let k=0;k<3;k++){const d=dueOf(t.getFullYear(),t.getMonth()+k,l.dueDay);if(d>TODAY)return d}}
function calc(l){const tx=S.tx.filter(t=>t.loan===l.id),prin=prinAt(l,'9999'),ig=tx.filter(t=>t.type==='Interest Generated').sort((a,b)=>a.date<b.date?-1:1);const gen=ig.reduce((a,t)=>a+t.amount,0),paid=tx.filter(t=>t.type.includes('Payment')).reduce((a,t)=>a+t.int,0);let left=paid,over=0,dt=0;ig.forEach(t=>{const p=Math.min(left,t.amount);left-=p;const pe=t.amount-p;if(pe>0&&t.date<TODAY)over+=pe;if(pe>0&&t.date===TODAY)dt+=pe});const pen=tx.filter(t=>t.type==='Penalty').reduce((a,t)=>a+t.amount,0),penPend=pen-tx.reduce((a,t)=>a+t.pen,0);return{prin,gen,paid,pend:gen-paid,over:over+penPend,dueToday:dt,nd:nextDue(l),exp:Math.round(prin*l.rate/100),pen,penPend}}
function alloc(l,a){const c=calc(l),i=Math.min(a,c.pend),pn=Math.min(a-i,c.penPend);return{int:i,pen:pn,prin:Math.min(a-i-pn,c.prin),c}}
function sched(l){const ig=S.tx.filter(t=>t.loan===l.id&&t.type==='Interest Generated').sort((a,b)=>a.date<b.date?-1:1);let left=S.tx.filter(t=>t.loan===l.id&&t.type.includes('Payment')).reduce((a,t)=>a+t.int,0);const r=ig.map(t=>{const p=Math.min(left,t.amount);left-=p;const pe=t.amount-p;return{date:t.date,amt:t.amount,paid:p,pend:pe,st:pe===0?'Paid':p>0?'Partial':t.date<TODAY?'Overdue':t.date===TODAY?'Due today':'Upcoming'}});const nd=nextDue(l);if(nd&&l.status==='ACTIVE'){const a=Math.round(prinAt(l,'9999')*l.rate/100);r.push({date:nd,amt:a,paid:0,pend:a,st:'Upcoming'})}return r}
function schedHtml(l,i){const rows=sched(l),c=calc(l),bc=s=>s==='Paid'?'':s==='Overdue'?'o':'w',pn=S.tx.filter(t=>t.loan===l.id&&t.type==='Penalty');return`<div class="c ov"><b>Loan ${i+1} · ${inr(l.amount)} · ${l.rate}%/mo</b><table><tr><th>Due date</th><th>Interest</th><th>Paid</th><th>Pending</th><th>Status</th></tr>${rows.map(x=>`<tr><td>${x.date}</td><td>${inr(x.amt)}</td><td>${inr(x.paid)}</td><td>${inr(x.pend)}</td><td><span class="b ${bc(x.st)}">${x.st}</span></td></tr>`).join('')}</table><div class="l" style="margin-top:6px">Late fee / charges: ${pn.length?pn.map(t=>t.date+' '+inr(t.amount)+(t.notes?' ('+esc(t.notes)+')':'')).join(', ')+' · pending '+inr(c.penPend):'none'}</div></div>`}
const M={};
function msgFor(r,k){const nm=cn(r.l.cust);if(k==='over')return `नमस्कार ${nm}, आपल्या ${inr(r.l.amount)} loan चे ${inr(r.c.over)} थकले आहे. कृपया लवकरात लवकर payment करावे. धन्यवाद. - ${S.owner}`;const t=r.c.dueToday>0,amt=t?r.c.dueToday:r.c.exp,d=t?'आज':(r.c.nd===TOM?'उद्या':r.c.nd);return `नमस्कार ${nm}, आपल्या ${inr(r.l.amount)} loan च्या ${inr(amt)} interest ची ${d} ही due date आहे. कृपया payment वेळेवर करावे. धन्यवाद. - ${S.owner}`}
function acts(r,k){const c=S.cust.find(x=>x.id===r.l.cust)||{},key=r.l.id+k;M[key]=msgFor(r,k);return `<span class="np" onclick="event.stopPropagation()"><a class="b" href="tel:+91${c.mobile}">Call</a><a class="b" target="_blank" rel="noopener" href="https://wa.me/91${c.mobile}?text=${encodeURIComponent(M[key])}">WhatsApp</a><a class="b w" href="#" onclick="cp('${key}');return false">Copy</a></span>`}
function cp(k){try{navigator.clipboard.writeText(M[k]).then(()=>toast('Copied ✓'),()=>toast(M[k]))}catch(e){toast(M[k])}}
const views={
home(){const rows=S.loans.filter(l=>l.status==='ACTIVE').map(l=>({l,c:calc(l)}));let prin=0,pend=0,over=0;rows.forEach(r=>{prin+=r.c.prin;pend+=r.c.pend;over+=r.c.over});const pays=S.tx.filter(t=>t.type.includes('Payment')),mp={};pays.forEach(t=>{const k=t.date.slice(0,7);mp[k]=mp[k]||{a:0,i:0,p:0};mp[k].a+=t.amount;mp[k].i+=t.int;mp[k].p+=t.prin});const tot=pays.reduce((a,t)=>a+t.amount,0),mc=(mp[TODAY.slice(0,7)]||{a:0}).a,td=pays.filter(t=>t.date===TODAY).reduce((a,t)=>a+t.amount,0);
const mw=Object.keys(mp).sort().reverse().map(k=>`<div class="r"><span>${k}</span><span>${inr(mp[k].a)} <span class="l">(int ${inr(mp[k].i)} · prin ${inr(mp[k].p)})</span></span></div>`).join('')||'<div class="l">No payments yet.</div>';
const row=(r,k,t)=>`<div class="r" onclick="go('custp','${r.l.cust}')"><span>${esc(cn(r.l.cust))} · ${t}</span>${acts(r,k)}</div>`;
const tm=rows.filter(r=>r.c.nd===TOM&&r.c.over===0),od=rows.filter(r=>r.c.over>0),dt=rows.filter(r=>r.c.dueToday>0);
return`<h2>Dashboard</h2><div class="g"><div class="c"><div class="n">${inr(prin)}</div><div class="l">Principal outstanding</div></div><div class="c"><div class="n">${inr(pend)}</div><div class="l">Pending interest</div></div><div class="c"><div class="n">${inr(td)}</div><div class="l">Collected today</div></div><div class="c"><div class="n" style="color:var(--rd)">${inr(over)}</div><div class="l">Overdue</div></div><div class="c"><div class="n">${inr(tot)}</div><div class="l">Total collected</div></div><div class="c"><div class="n">${inr(mc)}</div><div class="l">Collected this month</div></div></div>
<div class="c"><b>Collected month-wise</b>${mw}</div><div class="c"><b>Tomorrow — ${tm.length} customers have interest due</b>${tm.map(r=>row(r,'due',inr(r.c.exp))).join('')||'<div class="l">No dues tomorrow.</div>'}</div>
<div class="c"><b>Overdue loans</b>${od.map(r=>row(r,'over',inr(r.c.over))).join('')||'<div class="l">Nothing overdue.</div>'}</div><div class="c"><b>Due today</b>${dt.map(r=>row(r,'due',inr(r.c.dueToday))).join('')||'<div class="l">Nothing due today.</div>'}</div>`},
cust(){return`<h2>Customers</h2><div class="c np"><input id="cn" placeholder="Full name"><input id="cm" inputmode="numeric" placeholder="Mobile (10 digits)"><input id="cv" placeholder="Village"><input id="ct" placeholder="Taluka"><input id="ca" placeholder="Address (optional)"><button onclick="addCust()">Save customer</button></div>${S.cust.map(c=>{const ls=S.loans.filter(l=>l.cust===c.id);return`<div class="c" onclick="go('custp','${c.id}')"><b>${esc(c.name)}</b><div class="l">${esc(c.mobile)} · ${esc(c.village||'')} · ${ls.length} loan(s)</div>${ls.map((l,i)=>{const k=calc(l);return`<div class="r" onclick="event.stopPropagation();go('loan','${l.id}')"><span>Loan ${i+1} · ${inr(l.amount)} · ${l.rate}%${l.status==='CLOSED'?' · closed':''}</span><span>Prin ${inr(k.prin)} · Int ${inr(k.pend)}</span></div>`}).join('')}<button class="s np" onclick="event.stopPropagation();S.pref='${c.id}';go('loans')">+ Add loan</button></div>`}).join('')||'<div class="c l">No customers yet. Add the first one above.</div>'}`},
custp(){const c=S.cust.find(x=>x.id===S.sel);if(!c)return'<div class="c">Not found</div>';const ls=S.loans.filter(l=>l.cust===c.id),cs=ls.map(l=>({l,c:calc(l)})),tx=S.tx.filter(t=>t.cust===c.id),pays=tx.filter(t=>t.type.includes('Payment')),sum=(a,f)=>a.reduce((x,y)=>x+f(y),0),act=cs.filter(r=>r.l.status==='ACTIVE'),nds=act.map(r=>r.c.nd).filter(Boolean).sort();let bal=0;
const card=(n,l,x)=>`<div class="c"><div class="n" ${x||''}>${n}</div><div class="l">${l}</div></div>`;
const led=tx.map(t=>{const d=isDeb(t);bal+=d?t.amount:-t.amount;return`<tr><td>${t.date}</td><td>${t.type}</td><td>${d?inr(t.amount):''}</td><td>${d?'':inr(t.amount)}</td><td>${inr(t.int)}</td><td>${inr(t.prin)}</td><td>${inr(bal)}</td></tr>`}).join('');
const ph=pays.slice().reverse().map(t=>`<tr><td>${t.date}</td><td>${inr(t.amount)}</td><td>${inr(t.int)}</td><td>${inr(t.prin)}</td><td>${t.mode||''}</td></tr>`).join('');
return`<button class="s np" onclick="go('cust')">← Customers</button><h2>${esc(c.name)}</h2><div class="c"><div class="r"><span>Mobile</span><b>${esc(c.mobile)}</b></div><div class="r"><span>Village / Taluka</span><span>${esc(c.village||'-')} / ${esc(c.taluka||'-')}</span></div><div class="r"><span>Address</span><span>${esc(c.address||'-')}</span></div></div>
<div class="g">${card(ls.length+' / '+act.length,'Loans / Active')}${card(inr(sum(ls,l=>l.amount)),'Total borrowed')}${card(inr(sum(cs,r=>r.c.prin)),'Principal outstanding')}${card(inr(sum(cs,r=>r.c.pend)),'Interest pending')}${card(inr(sum(cs,r=>r.c.over)),'Overdue',sum(cs,r=>r.c.over)>0?'style="color:var(--rd)"':'')}${card(inr(sum(pays,t=>t.amount)),'Total paid')}${card(inr(sum(pays,t=>t.int)),'Interest paid')}${card(nds[0]||'-','Next due date')}</div>
<div class="np"><button onclick="go('pay',${act[0]?`'${act[0].id}'`:'null'})">Add payment</button><button class="s" onclick="S.pref='${c.id}';go('loans')">+ Add another loan</button><button class="s" onclick="window.print()">Print / Save PDF</button></div>
<h3>Loans</h3>${cs.map((r,i)=>`<div class="c" onclick="go('loan','${r.l.id}')"><b>Loan ${i+1}</b> <span class="b ${r.c.over>0?'o':r.l.status==='CLOSED'?'w':''}">${r.c.over>0?'Overdue':r.l.status}</span><div class="l">Amount ${inr(r.l.amount)} · ${r.l.rate}%/mo · started ${r.l.start} · due day ${r.l.dueDay}</div><div class="l">Principal ${inr(r.c.prin)} · interest pending ${inr(r.c.pend)} · overdue ${inr(r.c.over)} · next due ${r.c.nd||'-'}</div></div>`).join('')||'<div class="c l">No loans yet.</div>'}
<h3>Month-wise interest and charges</h3>${cs.map((r,i)=>schedHtml(r.l,i)).join('')}
<h3>Payment history</h3><div class="c ov">${ph?`<table><tr><th>Date</th><th>Amount</th><th>Interest</th><th>Principal</th><th>Mode</th></tr>${ph}</table>`:'<div class="l">No payments yet.</div>'}</div>
<h3>Full ledger</h3><div class="c ov">${led?`<table><tr><th>Date</th><th>Type</th><th>Debit</th><th>Credit</th><th>Int.</th><th>Prin.</th><th>Balance</th></tr>${led}</table>`:'<div class="l">No entries yet.</div>'}</div>`},
loans(){return`<h2>Loans</h2><div class="c np"><select id="lc">${S.cust.map(c=>`<option value="${c.id}" ${S.pref===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><input id="la" type="number" inputmode="numeric" placeholder="Loan amount ₹"><input id="lr" type="text" inputmode="decimal" placeholder="Interest % per month (e.g. 2)"><label class="l">Loan start date</label><input id="ls" type="date" value="${TODAY}"><label class="l">First interest due date (repeats monthly)</label><input id="ld" type="date"><button onclick="addLoan()">Create loan</button></div>${S.loans.map(l=>{const c=calc(l);return`<div class="c" onclick="go('loan','${l.id}')"><b>${esc(cn(l.cust))}</b> <span class="b ${c.over>0?'o':l.status==='CLOSED'?'w':''}">${c.over>0?'Overdue':l.status}</span><div class="l">${l.rate}%/mo · due day ${l.dueDay} · Principal ${inr(c.prin)} · Pending int. ${inr(c.pend)}</div></div>`}).join('')||'<div class="c l">No loans yet.</div>'}`},
loan(){const l=S.loans.find(x=>x.id===S.sel);if(!l)return'<div class="c">Not found</div>';const c=calc(l);let bal=0;const tx=S.tx.filter(t=>t.loan===l.id);const rows=tx.map(t=>{const d=isDeb(t);bal+=d?t.amount:-t.amount;return`<tr><td>${t.date}</td><td>${t.type}</td><td>${d?inr(t.amount):''}</td><td>${d?'':inr(t.amount)}</td><td>${inr(t.int)}</td><td>${inr(t.prin)}</td><td>${inr(bal)}</td></tr>`}).join('');
return`<button class="s np" onclick="go('loans')">← Back</button><h2><a href="#" onclick="go('custp','${l.cust}');return false">${esc(cn(l.cust))}</a></h2><div class="g"><div class="c"><div class="n">${inr(c.prin)}</div><div class="l">Principal</div></div><div class="c"><div class="n">${inr(c.pend)}</div><div class="l">Interest pending</div></div><div class="c"><div class="n">${inr(c.over)}</div><div class="l">Overdue</div></div><div class="c"><div class="n">${c.nd||'-'}</div><div class="l">Next due</div></div></div><button class="np" onclick="go('pay','${l.id}')">Add payment</button>${c.prin===0&&c.pend===0&&c.penPend===0&&l.status==='ACTIVE'?`<button class="s np" onclick="closeLoan('${l.id}')">Close loan</button>`:''}
<div class="c np"><b>Late fee / charge</b><input id="cf" type="number" inputmode="numeric" placeholder="Amount ₹"><input id="cnote" placeholder="Reason"><button class="s" onclick="addCharge('${l.id}')">Add charge</button></div><h3>Ledger</h3><div class="c ov"><table><tr><th>Date</th><th>Type</th><th>Debit</th><th>Credit</th><th>Int.</th><th>Prin.</th><th>Balance</th></tr>${rows}</table></div>`},
pay(){if(S.rec){const t=S.rec,c=calc(S.loans.find(x=>x.id===t.loan));return`<div class="c"><h2>Receipt</h2><div class="r"><span>Received from</span><b>${esc(cn(t.cust))}</b></div><div class="r"><span>Date</span><span>${t.date}</span></div><div class="r"><span>Amount</span><b>${inr(t.amount)}</b></div><div class="r"><span>Interest / Late fee / Principal</span><span>${inr(t.int)} / ${inr(t.pen)} / ${inr(t.prin)}</span></div><div class="r"><span>Mode</span><span>${esc(t.mode)}</span></div><div class="r"><span>Remaining principal</span><span>${inr(c.prin)}</span></div><div class="r"><span>Remaining interest</span><span>${inr(c.pend)}</span></div><div class="r"><span>Received by</span><span>${esc(S.owner)}</span></div><button class="np" onclick="window.print()">Print / Save PDF</button><button class="s np" onclick="S.rec=null;go('home')">Done</button></div>`}
const act=S.loans.filter(l=>l.status==='ACTIVE');if(!act.length)return'<h2>Add payment</h2><div class="c l">No active loans.</div>';const cur=act.find(x=>x.id===S.sel)||act[0];
return`<h2>Add payment</h2><div class="c"><select id="pl" onchange="selLoan()">${act.map(l=>`<option value="${l.id}" ${cur.id===l.id?'selected':''}>${esc(cn(l.cust))} · ${inr(l.amount)}</option>`).join('')}</select><input id="pa" type="number" inputmode="numeric" placeholder="Amount ₹" oninput="prev()"><label class="l">Interest % per month (change applies from next interest)</label><input id="pi" type="text" inputmode="decimal" value="${cur.rate}"><label class="l">Payment date</label><input id="pdt" type="date" value="${TODAY}"><select id="pm"><option>Cash</option><option>UPI</option><option>Bank</option></select><input id="pr" placeholder="Reference (optional)"><div id="pv" class="l"></div><button onclick="pay()">Save payment & receipt</button></div>`},
more(){return`<h2>More</h2><div class="c"><b>Settings</b><label class="l">Owner name (messages and receipts)</label><input id="on" value="${esc(S.owner)}"><button onclick="S.owner=$('on').value.trim()||'Owner';localStorage.setItem('owner',S.owner);toast('Saved ✓')">Save</button></div><div class="c l">Data is stored in your Supabase database and works on any device where you log in. Phone notifications: coming in the next step.</div><button class="s" onclick="logout()">Logout</button>`}};
const V=['home','cust','loans','pay','more'],T=['Home','Customers','Loans','Pay','More'];
function go(v,x){S.view=v;if(x!==undefined)S.sel=x;render()}
function render(){if(!S.auth){$('nav').style.display=$('fab').style.display='none';$('app').innerHTML=`<h2>Loan Book</h2><div class="c"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button onclick="login()">Login</button></div>`;return}$('nav').style.display='flex';$('fab').style.display='block';$('nav').innerHTML=V.map((v,i)=>`<button class="${S.view===v?'a':''}" onclick="go('${v}')">${T[i]}</button>`).join('');$('app').innerHTML=views[S.view]();if(S.view==='pay'&&!S.rec)prev();window.scrollTo(0,0)}
async function login(){const r=await SB.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(r.error)return toast(r.error.message);boot()}
async function logout(){await SB.auth.signOut();S.auth=false;render()}
async function boot(){const{data}=await SB.auth.getSession();if(!data.session){S.auth=false;return render()}S.auth=true;await load();await gen();render()}
async function addCust(){const n=$('cn').value.trim(),m=$('cm').value.replace(/\D/g,'').slice(-10);if(n.length<2)return toast('Customer cha naav taka');if(m.length!==10)return toast('10 digit mobile taka');if(S.cust.some(c=>c.mobile===m)&&!await ask('Ha mobile adhich ahe. Tarihi add karaych?'))return;const r=await SB.from('customers').insert({name:n,mobile:m,village:$('cv').value,taluka:$('ct').value,address:$('ca').value});if(r.error)return toast('Save failed: '+r.error.message);await load();render();toast('Customer saved ✓')}
async function addLoan(){const a=parseFloat($('la').value),r=parseFloat($('lr').value.replace(',','.')),fd=$('ld').value,st=$('ls').value,cid=$('lc').value;if(!cid)return toast('Adhi customer add kara');if(!(a>0))return toast('Loan amount taka');if(!(r>0&&r<=10))return toast('Interest % 0 te 10 madhe taka');if(!fd||!st||fd<=st)return toast('Due date start date nantarchi pahije');if(!await ask(`Create loan ${inr(a)} at ${r}% monthly, first due ${fd}?`))return;const l=await SB.from('loans').insert({customer_id:cid,start_date:st,amount:a,rate:r,first_due:fd,due_day:+fd.slice(8)}).select().single();if(l.error)return toast('Save failed: '+l.error.message);const t=await SB.from('transactions').insert({loan_id:l.data.id,customer_id:cid,tx_date:st,type:'Loan Disbursement',amount:a});if(t.error)return toast('Save failed: '+t.error.message);S.pref=null;await load();await gen();go('custp',cid);toast('Loan created ✓')}
function selLoan(){const l=S.loans.find(x=>x.id===$('pl').value);if(l)$('pi').value=l.rate;prev()}
function prev(){const l=S.loans.find(x=>x.id===$('pl').value);if(!l)return;const a=+$('pa').value||0,x=alloc(l,a);$('pv').innerHTML=`Outstanding now: principal ${inr(x.c.prin)} + interest ${inr(x.c.pend)} + late fee ${inr(x.c.penPend)}<br>This payment: interest ${inr(x.int)}, late fee ${inr(x.pen)}, principal ${inr(x.prin)}<br><b>After: principal ${inr(x.c.prin-x.prin)} + interest ${inr(x.c.pend-x.int)}</b>`+(a>x.int+x.pen+x.prin?'<br><span style="color:var(--rd)">Amount exceeds total outstanding</span>':'')}
async function pay(){const l=S.loans.find(x=>x.id===$('pl').value),a=parseFloat($('pa').value),dt=$('pdt').value;if(!l||!(a>0))return toast('Amount taka');if(!dt||dt>TODAY||dt<l.start)return toast('Payment date barobar nivda');const rt=parseFloat($('pi').value.replace(',','.'));if(!(rt>0&&rt<=10))return toast('Interest % 0 te 10 madhe taka');if(rt!==l.rate){if(!await ask(`Change interest from ${l.rate}% to ${rt}% monthly from now on?`))return;const u=await SB.from('loans').update({rate:rt}).eq('id',l.id);if(u.error)return toast('Rate update failed: '+u.error.message)}const x=alloc(l,a);if(a>x.int+x.pen+x.prin)return toast('Payment exceeds outstanding amount');const r=await SB.from('transactions').insert({loan_id:l.id,customer_id:l.cust,tx_date:dt,type:x.prin&&(x.int||x.pen)?'Combined Payment':x.prin?'Principal Payment':'Interest Payment',amount:a,interest_part:x.int,principal_part:x.prin,penalty_part:x.pen,mode:$('pm').value,reference:$('pr').value}).select().single();if(r.error)return toast('Save failed: '+r.error.message);await load();S.rec=S.tx.find(t=>t.id===r.data.id);render()}
async function addCharge(i){const l=S.loans.find(x=>x.id===i),a=parseFloat($('cf').value);if(!(a>0))return toast('Charge amount taka');if(!await ask(`Add charge ${inr(a)} to ${cn(l.cust)}?`))return;const r=await SB.from('transactions').insert({loan_id:i,customer_id:l.cust,tx_date:TODAY,type:'Penalty',amount:a,notes:$('cnote').value});if(r.error)return toast('Save failed: '+r.error.message);await load();render();toast('Charge added ✓')}
async function closeLoan(i){const l=S.loans.find(x=>x.id===i);if(!await ask('Close this loan? History is kept.'))return;const u=await SB.from('loans').update({status:'CLOSED'}).eq('id',i);if(u.error)return toast('Failed: '+u.error.message);await SB.from('transactions').insert({loan_id:i,customer_id:l.cust,tx_date:TODAY,type:'Loan Closure',amount:0});await load();render()}
boot();
</script></body></html>
